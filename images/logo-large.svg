<svg width="400" height="120" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Main background -->
  <rect width="400" height="120" fill="white"/>
  
  <!-- Hexagon pattern - industrial design element -->
  <g opacity="0.12">
    <path d="M 30,60 L 45,52 L 60,60 L 60,76 L 45,84 L 30,76 Z" fill="#0066cc"/>
    <path d="M 60,44 L 75,36 L 90,44 L 90,60 L 75,68 L 60,60 Z" fill="#0066cc"/>
    <path d="M 60,76 L 75,68 L 90,76 L 90,92 L 75,100 L 60,92 Z" fill="#0066cc"/>
  </g>
  
  <!-- Company name -->
  <text x="120" y="70" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="bold" fill="#0066cc" letter-spacing="2">
    METATECNO
  </text>
  
  <!-- Accent line -->
  <rect x="120" y="78" width="260" height="3" fill="#00d4aa"/>
  
  <!-- Subtitle -->
  <text x="120" y="98" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#666" letter-spacing="2">
    TECHNOLOGY CO., LTD
  </text>
  
  <!-- Decorative element -->
  <circle cx="380" cy="94" r="3" fill="#ff6b35"/>
</svg>
