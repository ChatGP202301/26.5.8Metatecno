<svg width="240" height="80" viewBox="0 0 240 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="240" height="80" fill="white"/>
  
  <!-- Decorative element - hexagon pattern representing industrial/technical theme -->
  <g opacity="0.15">
    <path d="M 20,40 L 30,35 L 40,40 L 40,50 L 30,55 L 20,50 Z" fill="#0066cc"/>
    <path d="M 40,30 L 50,25 L 60,30 L 60,40 L 50,45 L 40,40 Z" fill="#0066cc"/>
    <path d="M 40,50 L 50,45 L 60,50 L 60,60 L 50,65 L 40,60 Z" fill="#0066cc"/>
  </g>
  
  <!-- Main Logo Text - METATECNO -->
  <text x="75" y="42" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#0066cc" letter-spacing="1">
    METATECNO
  </text>
  
  <!-- Accent line -->
  <rect x="75" y="48" width="155" height="2" fill="#00d4aa"/>
  
  <!-- Tagline -->
  <text x="75" y="62" font-family="Arial, sans-serif" font-size="9" fill="#666" letter-spacing="1.5">
    TECHNOLOGY CO., LTD
  </text>
  
  <!-- Small accent dot -->
  <circle cx="228" cy="59" r="2" fill="#ff6b35"/>
</svg>
